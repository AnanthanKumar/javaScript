<!DOCTYPE html>
<html runat="server">
    <head>
        <title>
            Add Numbers Practice
        </title>
        <script type="text/Javascript">
            function addNumbers () {
                var firstNumber = document.getElementById("txtFirstNumber").value;
                if (firstNumber == "") {
                    alert("Please Enter the First Number");
                    return;
                }
                firstNumber = parseFloat(firstNumber);
                if (isNaN(firstNumber)) {
                    alert("Enter valid First number");
                    return;
                }
                var secondNumber = document.getElementById("txtSecondNumber").value;
                if (secondNumber == "") {
                    alert("Please Enter the Second Number");
                    return;
                }
                secondNumber = parseFloat(secondNumber);
                if (isNaN(secondNumber)) {
                    alert("Enter Valid Second number")
                    return;
                }
                document.getElementById("txtResult").value = firstNumber + secondNumber;
            }
        </script>
        <body>
            <form id="form1" runat="server">
                <table style="border: 2px solid yellow; font-family: Arial;">
                    <tr>
                        <td>
                            First Number
                        </td>
                        <td>
                            <input type="text" id="txtFirstNumber" runat="server">
                        </td>
                    </tr>
                    <tr>
                        <td>
                            Second Number
                        </td>
                        <td>
                            <input type="text" id="txtSecondNumber" runat="server">
                        </td>
                    </tr>
                    <tr>
                        <td>
                            Result
                        </td>
                        <td>
                            <input type="text" id="txtResult" runat="server">
                        </td>
                    </tr>
                    <tr>
                        <td>
                        </td>
                        <td>
                            <input type="button" value="Add Numbers" id="txtAddNumbers" onclick="addNumbers ()">
                        </td>
                    </tr>
                </table>
            </form>
        </body>
    </head>
</html>
