<!DOCTYPE html>
<html runat="server">
    <head>
        <title>
            Add Numbers Practice
        </title>
        <script type="text/JavaScript">
            function addNumbers () {
                var firstNumber = document.getElementById("txtFirstNumber").value;
                if (firstNumber == "") {
                    alert("Enter the First Number");
                    return;
                }
                firstNumber = parseFloat(firstNumber);
                if (isNaN(firstNumber)) {
                    alert("Please Enter Valid First Number");
                    return;
                }
                var secondNumber = document.getElementById("txtSecondNumber").value;
                if (secondNumber == "") {
                    alert("Enter the Second Number")
                    return;
                }
                secondNumber = parseFloat(secondNumber);
                if (isNaN(secondNumber)) {
                    alert("Enter valid second number")
                    return;
                }
                document.getElementById("txtResult").value = firstNumber + secondNumber;
            }
        </script>
    </head>
    <body>
        <h1>
            Javascript Practice
        </h1>
        <form id="form2">
            <table style="border: 2px solid mediumseagreen; font-family: Arial;">
                <tr>
                    <td>
                        First Number
                    </td>
                    <td>
                        <input type="text" id="txtFirstNumber" runat="server">
                    </td>
                </tr>
                <tr>
                    <td>
                        Second Number
                    </td>
                    <td>
                        <input type="text" id="txtSecondNumber" runat="server">
                    </td>
                </tr>
                <tr>
                    <td>
                        Result
                    </td>
                    <td>
                        <input type="text" id="txtResult" runat="server">
                    </td>
                </tr>
                <tr>
                    <td>
                    </td>
                    <td>
                        <input type="button" value="Add Numbers" id="txtAddNumbers" onclick="addNumbers ()" runat="server">
                    </td>
                </tr>
            </table>
        </form>
    </body>
</html>
