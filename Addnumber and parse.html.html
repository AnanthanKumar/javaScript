<!DOCTYPE html>
<html>
    <head runat="server">
        <title>
            JavaScript Practice
        </title>
        <h1>
            HTML/JavaScript Practice
        </h1>
        <script type="text/JavaScript">
            function addNumbers() {
                var firstNumber = document.getElementById("txtFirstNumber").value;
                if (firstNumber == "") {
                    alert("First Number is Required");
                    return;
                }
                firstNumber = parseFloat(firstNumber)
                if (isNaN(firstNumber)) {
                    alert("Enter a Valid First Number");
                    return;
                }
                var secondNumber = document.getElementById("txtSecondNumber").value;
                if(secondNumber == "") {
                    alert("Second Number is Required");
                    return;
                }
                secondNumber = parseFloat(secondNumber)
                if (isNaN(secondNumber)) {
                    alert("Enter a Valid Second Number");
                    return;
                }
                document.getElementById("txtResult").value = firstNumber + secondNumber;
            }
        </script>
        <body>
            <form id="form1" runat="server">
                <table style="border: 1px solid black; font-family: Arial">
<tr>
    <td>
        First Number
    </td>
    <td>
        <input type="text" id="txtFirstNumber" runat="server">
    </td>
</tr>
<tr>
    <td>
        Second Number
    </td>
    <td>
        <input type="text" id="txtSecondNumber" runat="server">
    </td>
</tr>
<tr>
    <td>
        Result
    </td>
    <td>
        <input type="text" id="txtResult" runat="server">
    </td>
</tr>
<tr>
    <td>
    </td>
    <td>
        <input type="button" value="Add" id="btnAdd" onclick="addNumbers()">
    </td>
</tr>
                </table>
            </form>
        </body>

    </head>
</html>
